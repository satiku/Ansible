---


- name: Download latest node.js install script
  get_url:
    url: https://deb.nodesource.com/setup_22.x
    dest: /home/pi/nodesource_setup.sh
    mode: 0755


- name: Run latest node.js source script
  command: bash /home/pi/nodesource_setup.sh
  become: yes
  become_user: root
#  args:
#    chdir: /home/pi
#    creates: /home/pi/MagicMirror/
#  notify: auto startup
#




#- name: rotate display
#  lineinfile:
#    dest: /boot/config.txt
#    regexp: '^display_rotate'
#    line: 'display_rotate=3'
#
- name: install npm
  become: yes
  become_user: root
  apt:
    update_cache: yes
    name: nodejs=22.0.0-1nodesource1
    state: present

- name: copy script
  copy:
    src: files/raspberry.sh
    dest: /home/pi/raspberry.sh
    owner: pi
    mode: 0755



# - name : pull magic mirror
#   become: yes
#   become_user: pi
#   git:
#     repo: https://github.com/MichMich/MagicMirror.git
#     dest: /home/pi/MagicMirror
#     force: yes
#   notify: install mirror


- name: pull MagicMirror
  become: yes
  become_user: pi
  git:
    repo: https://github.com/MagicMirrorOrg/MagicMirror.git
    dest: /home/pi/MagicMirror
    force: yes
  notify: install mirror


- name: pull traffic
  become: yes
  become_user: pi
  git:
    repo: https://github.com/SamLewis0602/MMM-Traffic.git
    dest: /home/pi/MagicMirror/modules/MMM-Traffic
    force: yes
  notify: install traffic


- name: pull PIR
  become: yes
  become_user: pi
  git:
    repo: https://github.com/paviro/MMM-PIR-Sensor.git
    dest: /home/pi/MagicMirror/modules/MMM-PIR-Sensor
    force: yes
  notify: install PIR


- name: pull redit
  become: yes
  become_user: pi
  git:
    repo: https://github.com/kjb085/MMM-Reddit.git
    dest: /home/pi/MagicMirror/modules/MMM-Reddit
    force: yes
  notify: install redit


- name: pull todoist
  become: yes
  become_user: pi
  git:
    repo: https://github.com/cbrooker/MMM-Todoist
    dest: /home/pi/MagicMirror/modules/MMM-Todoist
    force: yes
  notify: install todoist


- name: load config
  template:
    src: templates/config.js.jinja
    dest: /home/pi/MagicMirror/config/config.js
  notify: restart


- name: Install pm2
#  become: yes
#  become_user: pi
  npm:
    name: pm2
    global: yes


